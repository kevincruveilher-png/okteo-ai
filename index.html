<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oktéo AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">Oktéo <b>AI</b></div>
    <button class="badge" title="Chantier ouvert : cliquez pour changer de chantier">…</button>
    <div class="levels" id="levels" role="tablist" aria-label="Niveaux"></div>
    <div class="pop pop-left" id="pop-relev">
      <button id="btn-relev" aria-haspopup="true" aria-expanded="false" title="Relever automatiquement le plan PDF : murs, pièces, appareillage, ou relevé par l'IA">⤓ Relevé ▾</button>
      <div class="pop-body relev" hidden>
        <p class="mut sm">Chaque relevé montre un aperçu en orange : vous gardez ou non le résultat. Ctrl+Z annule.</p>
        <button id="rv-walls" title="Lit les murs dessinés dans le PDF (sans IA) : épaisseurs, portes, fenêtres. L'échelle est réglée toute seule d'après les cotes si besoin."><b>1. Murs</b><small>du PDF, sans IA</small></button>
        <button id="rv-rooms" title="Trouve les pièces fermées par les murs, leur surface et leur nom lu sur le plan. Il faut des murs."><b>2. Pièces</b><small>noms et surfaces</small></button>
        <button id="rv-devices" title="Lit les symboles du plan : prises, interrupteurs, points lumineux… et leurs liaisons."><b>3. Appareillage</b><small>symboles et liaisons</small></button>
        <div class="pop-sep"></div>
        <button id="rv-ai" class="btn-ai" title="L'IA regarde l'image du plan et propose murs, pièces et appareils, pour comparer avec le relevé sans IA. Il faut une clé IA (Paramètres)."><b>✦ Relevé par l'IA</b><small>murs, pièces et appareils, pour comparer</small></button>
      </div>
    </div>
    <div class="grow"></div>
    <label class="ck" title="Force les murs et les cotes à l'horizontale ou à la verticale"><input type="checkbox" id="ortho" checked> Angles droits</label>
    <div class="pop" id="pop-view">
      <button id="btn-view" aria-haspopup="true" aria-expanded="false" title="Cotes, repères, fond de plan, taille des symboles">Affichage ▾</button>
      <div class="pop-body" hidden>
        <label class="ck"><input type="checkbox" id="dims" checked> Cotes</label>
        <label class="ck"><input type="checkbox" id="reps" checked> Repères (P1, I2…)</label>
        <label class="ck" title="Les murs du niveau du dessous en gris clair, pour caler ceux de l'étage"><input type="checkbox" id="below" checked> Niveau du dessous en transparence</label>
        <div class="slider" title="Visibilité du fond">Fond<input id="bg" type="range" min="0" max="100" value="60"><span id="bgv" class="num">60%</span></div>
        <div class="slider" title="Diamètre des symboles (cm)">Symboles<input id="sym" type="range" min="6" max="60" value="20"><span id="symv" class="num">20</span></div>
        <button id="theme" title="Thème clair / sombre">◐ Thème clair / sombre</button>
        <button id="export" title="Données du dessin au format JSON (murs, pièces, appareils, liaisons)">Exporter les données (JSON)</button>
      </div>
    </div>
    <div class="sep"></div>
    <button id="undo" title="Annuler (Ctrl+Z)">↶</button><button id="redo" title="Rétablir (Ctrl+Y)">↷</button>
    <button class="ctl" id="ctl" title="Contrôle du plan">✓ Contrôle</button>
    <div class="chip"><span class="dot" id="savedot"></span><span id="savetxt">Enregistré</span></div>
    <button id="btn-print" title="Plan imprimable en PDF, à l'échelle, avec cartouche et nomenclature (Ctrl+P)">🖨 Imprimer</button>
    <div class="sep"></div>
    <button id="btn-palette" title="Toutes les fonctions, avec recherche (Ctrl+K)">⌕ Fonctions</button>
  </div>
  <div class="top2">
    <div class="grp grp-act" title="Actions : dessiner le bâtiment (1re barre) et poser l'appareillage (2e barre)"><span class="glab">Actions</span><div class="tool" id="tools"></div></div>
    <div class="grp grp-view"><span class="glab">Vues</span><div class="vfilter" id="vfilter" role="group" aria-label="Filtre de la vue"></div></div>
    <div class="grp grp-pan"><span class="glab">Panneaux</span><div class="panes" id="panes" role="group" aria-label="Panneaux de droite"></div></div>
  </div>
  <div class="main">
    <nav class="tabs" id="tabs"></nav>
    <div class="stage">
      <svg id="sv" viewBox="0 0 100 70" preserveAspectRatio="xMidYMid meet" aria-label="Plan du chantier"></svg>
      <svg class="fx" id="fx" aria-hidden="true" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="hud" id="hud" hidden></div>
      <div class="readout" id="readout" hidden></div>
      <div class="hint" id="hint"></div>
      <div class="as-dock" id="as-dock" aria-label="Assistant"></div>
      <div class="zoomw"><button id="zout">−</button><button id="zfit">Ajuster</button><button id="zin">+</button></div>
    </div>
    <section class="params" id="params" hidden></section>
    <section class="params" id="chantiers" hidden></section>
    <section class="params" id="boites" hidden></section>
    <section class="params" id="bandes" hidden></section>
    <section class="params" id="lignes" hidden></section>
    <aside class="side" id="side">
      <div class="side-grip" id="side-grip" title="Glisser pour élargir le panneau"></div>
      <div class="side-head" id="side-head"></div>
      <div class="pane" data-pane="props" id="sidebody"></div>
    </aside>
  </div>
</div>
<script type="module" src="/src/app.js"></script>
<script type="module" src="/src/ext/main.js"></script>
</body>
</html>

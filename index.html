<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oktéo AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">Oktéo <b>AI</b></div>
    <button class="badge" title="Chantier ouvert : cliquez pour changer de chantier">…</button>
    <div class="sep"></div>
    <div class="tool" id="tools"></div>
    <div class="grow"></div>
    <label class="ck"><input type="checkbox" id="ortho" checked> Angles droits</label>
    <label class="ck"><input type="checkbox" id="dims" checked> Cotes</label>
    <label class="ck"><input type="checkbox" id="reps" checked> Repères</label>
    <div class="slider" title="Visibilité du fond">Fond<input id="bg" type="range" min="0" max="100" value="60"><span id="bgv" class="num">60%</span></div>
    <div class="slider" title="Diamètre des symboles (cm)">App.<input id="sym" type="range" min="6" max="60" value="20"><span id="symv" class="num">20</span></div>
    <div class="sep"></div>
    <button id="undo" title="Annuler (Ctrl+Z)">↶</button><button id="redo" title="Rétablir (Ctrl+Y)">↷</button>
    <div class="chip"><span class="dot" id="savedot"></span><span id="savetxt">Enregistré</span></div>
    <button id="export">Exporter</button><button id="theme" title="Thème">◐</button>
    <div class="sep"></div>
    <button id="btn-palette" title="Toutes les fonctions, avec recherche (Ctrl+K)">⌕ Fonctions</button>
    <button id="btn-assistant" class="btn-ai" title="Ouvrir l'assistant IA (touche A)">✦ Assistant</button>
  </div>
  <div class="main">
    <nav class="tabs" id="tabs"></nav>
    <div class="stage">
      <svg id="sv" viewBox="0 0 100 70" preserveAspectRatio="xMidYMid meet" aria-label="Plan du chantier"></svg>
      <div class="hud" id="hud" hidden></div>
      <div class="readout" id="readout" hidden></div>
      <div class="hint" id="hint"></div>
      <div class="zoomw"><button id="zout">−</button><button id="zfit">Ajuster</button><button id="zin">+</button></div>
    </div>
    <section class="params" id="params" hidden></section>
    <section class="params" id="chantiers" hidden></section>
    <aside class="side" id="side">
      <div class="side-grip" id="side-grip" title="Glisser pour élargir le panneau"></div>
      <div class="side-head" id="side-head"></div>
      <div class="pane" data-pane="props" id="sidebody"></div>
    </aside>
  </div>
</div>
<script type="module" src="/src/app.js"></script>
<script type="module" src="/src/ext/main.js"></script>
</body>
</html>

# TEMPORAIRE (v76) : vérification courte du chemin des scans du mode 3 (OpenCV.js / Tesseract.js) — quelques minutes au
# lieu de la suite complète. À retirer avant toute fusion dans main.
name: raster-v76
on:
  push:
    branches: ["feat/analyse-ia-modes-v76"]
    paths: ["src/ext/ai-raster.js", "src/ext/ai-cv-worker.js", "scripts/raster.browser.mjs", "scripts/vendor-ia.mjs", ".github/workflows/raster-v76.yml"]
permissions: { contents: read }
jobs:
  raster:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/vendor-ia.mjs && node scripts/raster.browser.mjs
        timeout-minutes: 8

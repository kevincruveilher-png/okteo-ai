# TEMPORAIRE (3D-1 / 3D-2) : vérification des branches feat/3d-* (pas de npm dans la session de développement).
# À retirer avant toute fusion dans main.
name: verification-3d
on: { push: { branches: ["feat/3d-*"] } }
permissions: { contents: write }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # nouvelle dépendance three.js (MIT) : le verrou npm est complété ici puis enregistré sur la branche
      - run: npm install --no-audit --no-fund
      - name: verrou npm enregistré s'il a changé
        run: |
          if ! git diff --quiet package-lock.json; then
            git config user.name ci && git config user.email ci@example.invalid
            git add package-lock.json && git commit -qm "3D : verrou npm (three.js) complété par la vérification"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - run: npm run licences
      - run: npx playwright install --with-deps chromium
      - run: node scripts/v3d.test.mjs
      - run: npm run check
        timeout-minutes: 40
      - run: npm run build:web
        if: always()
      - run: npm run test:web
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: capture-3d, path: scripts/derniere-capture.png, retention-days: 7 }

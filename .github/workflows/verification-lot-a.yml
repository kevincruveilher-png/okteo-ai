# TEMPORAIRE (lot A du 04/11/2026) : vérification des branches feat/lot-a-* (pas de npm dans la session de développement).
# À retirer avant chaque fusion dans main.
name: verification-lot-a
on: { push: { branches: ["feat/plan-*"] } }
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      - run: node scripts/perf-probe.mjs
      - run: npm run check
        timeout-minutes: 40
      - run: npm run build:web
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: capture-lot-a, path: scripts/derniere-capture.png, retention-days: 7, if-no-files-found: ignore }

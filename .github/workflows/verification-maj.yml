# TEMPORAIRE (lots de la reprise FTZ, 06/11/2026) : vérification des branches feat/maj-* (pas de npm dans la session de
# développement). Les captures sont poussées sur la branche verification-captures-parametres. À retirer avant la fusion.
name: verification-lots
on: { push: { branches: ["feat/maj-*"] } }
permissions: { contents: write }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/shots-parametres.mjs
        if: always()
      - name: captures sur une branche à part
        if: always()
        run: |
          [ -d shots ] || exit 0
          mkdir -p /tmp/cap && cp shots/*.png /tmp/cap/ 2>/dev/null || exit 0
          git config user.name "verification" && git config user.email "verification@users.noreply.github.com"
          git checkout --orphan verification-captures-parametres && git rm -rf -q . && rm -rf shots
          cp /tmp/cap/*.png . && git add *.png && git commit -q -m "captures ${GITHUB_SHA}" && git push -f origin verification-captures-parametres
      - run: git checkout -f ${GITHUB_SHA}
        if: always()
      - run: npm run test:web
      - run: npm run check
        timeout-minutes: 40
      - run: npm run build:web
        if: always()

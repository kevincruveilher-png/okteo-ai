# TEMPORAIRE (tableau + portes 3D + déplacer 3D, 07/11/2026) : vérification de feat/3d-deplacer (pile des 3 lots). Jamais fusionné dans main.
name: verification-3lots
on: { push: { branches: ["verification-3lots"] } }
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run check
        timeout-minutes: 40
      - run: npm run build:web
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: capture-3lots, path: scripts/derniere-capture.png, retention-days: 7, if-no-files-found: ignore }

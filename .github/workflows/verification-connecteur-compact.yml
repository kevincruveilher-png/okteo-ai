# TEMPORAIRE (connecteur compact, 07/11/2026) : vérification de feat/connecteur-compact. Jamais fusionné dans main.
name: verification-connecteur-compact
on: { push: { branches: ["verification-connecteur-compact"] } }
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run check
        timeout-minutes: 40
      - run: npm run build:web
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: capture-connecteur, path: scripts/derniere-capture.png, retention-days: 7, if-no-files-found: ignore }

# TEMPORAIRE (v77) : vérification de la branche feat/releve-colle-ref-calibre (pas de npm dans la session de développement).
# À retirer avant toute fusion dans main.
name: verification-releve-colle
on: { push: { branches: ["feat/releve-colle-ref-calibre"] } }
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/ai-align.test.mjs
      - run: npm run check
        timeout-minutes: 40
      - run: npm run build:web
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: capture-releve, path: scripts/derniere-capture.png, retention-days: 7, if-no-files-found: ignore }

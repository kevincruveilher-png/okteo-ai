name: Comparaison avec la version precedente
on:
  push:
    branches: [verification-tableau-66-1]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e096a510c49ed09fbf6a74ef0d07b46f65d8ed31
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run build
        if: always()

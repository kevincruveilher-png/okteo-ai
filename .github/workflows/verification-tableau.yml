name: Verification finale tableau 66.1
on:
  push:
    branches: [verification-tableau-66-1]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f0a4de5dc5da3be22f1961f7ec773df1942f05d0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run build
        if: always()

<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion · Oktéo AI</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111820;color:#eaf0f5;font:15px system-ui,sans-serif}main{width:min(440px,92vw);padding:40px;background:#1b2530;border:1px solid #354453;border-radius:18px;box-shadow:0 22px 80px #0006}small{color:#99adbb;letter-spacing:.12em}h1{font-size:34px;margin:12px 0 8px}h1 span{color:#dd9c5f}p{color:#aebfca;line-height:1.6}label{display:block;margin:20px 0 7px}input,button{width:100%;padding:13px;border-radius:7px;border:1px solid #435361;font:inherit}input{background:#111a22;color:#fff}button{margin-top:24px;background:#d69b62;color:#18212a;font-weight:700;cursor:pointer}#message{color:#ffc89b;min-height:24px}footer{margin-top:26px;font-size:12px;color:#91a3af}a{color:#dd9c5f}</style>
<main><small>KITÉOHM · BUREAU D’ÉTUDES</small><h1>Oktéo <span>AI</span></h1><p id="intro">Votre espace de dessin électrique.<br>Connectez-vous avec votre compte entreprise.</p><form id="login"><label for="login-name">Identifiant</label><input id="login-name" name="login" autocomplete="username" required maxlength="64"><label for="password">Mot de passe</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"><div id="change" hidden><label for="new-password">Nouveau mot de passe · 12 caractères minimum</label><input id="new-password" type="password" autocomplete="new-password" minlength="12" maxlength="256"></div><button>Se connecter</button></form><p id="message" role="status"></p><footer>Compte ou mot de passe : contactez un administrateur.<br>Les dossiers de chantier restent sur votre poste jusqu’à l’export.</footer></main>
<script src="/login.js" defer></script></html>
